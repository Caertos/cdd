name: Publish

on:
  push:
    tags:
      - 'v*'

# id-token: write is required for npm trusted publishing (OIDC).
# contents: write is required to create the GitHub Release.
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest # npm trusted publishing only supports hosted runners
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # npm >= 11.5.1 (Node 24) is required for the OIDC exchange.
          node-version: 24
          cache: pnpm
          # Deliberately NOT setting registry-url: it would inject
          # NODE_AUTH_TOKEN and make npm/pnpm skip the OIDC path.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm test

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "v${PKG_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}" >&2
            exit 1
          fi

      - name: Publish to npm (trusted publishing / OIDC)
        # No NPM_TOKEN here on purpose: with no static token configured,
        # pnpm performs the OIDC exchange against the npm trusted publisher.
        # --no-git-checks: the runner is at a detached HEAD on the tag.
        # --publish-wait-timeout: wait for npm's post-publish malware scan
        # ("Validating") before considering the release done.
        run: pnpm publish --access public --no-git-checks --provenance --publish-wait-timeout=900000

      - name: Extract changelog for this version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          awk -v ver="${VERSION}" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG section found for ${VERSION}" >&2
            echo "Release ${VERSION}" > RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "cdd-cli ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md
